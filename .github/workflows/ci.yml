name: SafeHour CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: safehour-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: npm run lint

      - name: 자동 테스트
        run: npm test

      - name: 프로덕션 빌드
        run: npm run build

      - name: 운영 의존성 보안 감사
        run: npm run audit

      # E2E 는 외부 API 없이 돈다 — 캐시 시드로 TourAPI 호출을 대체한다.
      # 판정 엔진·정규화·API 라우트는 실제 코드가 실행된다.
      - name: E2E 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 핵심 흐름 E2E (360px)
        run: npm run e2e
        env:
          SAFEHOUR_DATA_ROOT: .e2e-data
          TOUR_API_KEY: e2e-dummy-key

      - name: E2E 실패 아티팩트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
